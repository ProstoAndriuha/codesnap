name: Verify CodeSnap
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  extension:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  cloud-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-service
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud-service/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
