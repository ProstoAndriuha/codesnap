name: Verify CodeSnap
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  extension-and-mail-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Install test native host
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-mail-helper.ps1
      - run: python -m unittest discover -s native -p test_mail_host.py -v
      - run: npm run build
